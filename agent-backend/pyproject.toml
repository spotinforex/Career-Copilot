[project]
name = "agent-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "boto3>=1.43.57",
    "botocore[crt]>=1.43.57",
    "fastapi>=0.140.7",
    "google-genai>=2.14.0",
    "httpx>=0.28.1",
    "mangum>=0.21.0",
    "mcp>=1.28.1",
    "pdfplumber>=0.11.10",
    "pgvector>=0.5.0",
    "psycopg2-binary>=2.9.12",
    "pyjwt>=2.13.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "redis>=8.0.1",
    "reportlab>=5.0.0",
    "sentence-transformers>=5.6.1",
    "uvicorn[standard]>=0.51.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
